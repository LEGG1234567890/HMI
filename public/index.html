<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Human-Machine Interface</h1>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="monitor">Monitor</button>
    <button class="tab-btn" data-tab="variables">Variables</button>
  </nav>
  <div class="conn">
    <select id="ports"></select>
    <select id="baud">
      <option value="9600">9600</option>
      <option value="115200">115200</option>
    </select>
    <button id="btnConn">Conectar</button>
    <span id="estado" class="off">Desconectado</span>
  </div>
</header>

<!-- ===================== PESTAÑA MONITOR ===================== -->
<section id="tab-monitor" class="tab-page active">
  <div class="charts">
    <div class="chart-box">
      <h3>Variable de Proceso (PV) y Referencia (SP)</h3>
      <canvas id="chartPV" width="600" height="220"></canvas>
    </div>
    <div class="chart-box">
      <h3>Error y Manipulación</h3>
      <canvas id="chartErr" width="600" height="220"></canvas>
    </div>
  </div>

  <div class="panel">
    <div class="field"><label>Referencia</label>
      <input type="number" id="referencia" value="0" step="1">
    </div>
    <div class="field"><label>Proceso</label><output id="pv">0</output></div>
    <div class="field"><label>Error</label><output id="error">0</output></div>
    <div class="field"><label>Manipulación</label>
      <input type="number" id="op" value="0" min="0" max="100" step="1">
    </div>
    <div class="field"><label>T<sub>s</sub> (s)</label>
      <input type="number" id="ts" value="1" min="0.1" step="0.1">
    </div>

    <div class="field"><label>K<sub>c</sub></label>
      <input type="number" id="kc" value="0" step="0.1">
    </div>
    <div class="field"><label>&#964<sub>i</sub></label>
      <input type="number" id="taui" value="0" step="0.1">
    </div>
    <div class="field"><label>&#964<sub>d</sub></label>
      <input type="number" id="taud" value="0" step="0.1">
    </div>

    <div class="field switch">
      <label>Modo de Control</label>
      <button id="modoCtrl" class="toggle">Manual</button>
    </div>

    <div class="field switch">
      <label>Archivar datos</label>
      <button id="archivar" class="toggle">OFF</button>
    </div>
    <div class="field">
      <button id="btnSave">Guardar Datos</button>
    </div>
    <div class="field"><label>Elementos</label><output id="contador">0</output></div>

    <div class="field">
      <button id="btnStop" class="btn-stop">STOP</button>
    </div>
  </div>
</section>

<!-- ===================== PESTAÑA SIMULACIÓN ===================== -->
<section id="tab-simulacion" class="tab-page">
  <div class="charts">
    <div class="chart-box">
      <h3>Variable de Proceso (PV) y Referencia (SP)</h3>
      <canvas id="chartPV" width="600" height="220"></canvas>
    </div>
    <div class="chart-box">
      <h3>Error y Manipulación</h3>
      <canvas id="chartErr" width="600" height="220"></canvas>
    </div>
  </div>

  <div class="panel">
    <div class="field"><label>Referencia</label>
      <input type="number" id="referencia" value="0" step="1">
    </div>
    <div class="field"><label>Proceso</label><output id="pv">0</output></div>
    <div class="field"><label>Error</label><output id="error">0</output></div>
    <div class="field"><label>Manipulación</label>
      <input type="number" id="op" value="0" min="0" max="100" step="1">
    </div>
    <div class="field"><label>T<sub>s</sub> (s)</label>
      <input type="number" id="ts" value="1" min="0.1" step="0.1">
    </div>

    <div class="field"><label>K<sub>c</sub></label>
      <input type="number" id="kc" value="0" step="0.1">
    </div>
    <div class="field"><label>&#964<sub>i</sub></label>
      <input type="number" id="taui" value="0" step="0.1">
    </div>
    <div class="field"><label>&#964<sub>d</sub></label>
      <input type="number" id="taud" value="0" step="0.1">
    </div>

    <div class="field switch">
      <label>Modo de Control</label>
      <button id="modoCtrl" class="toggle">Manual</button>
    </div>

    <div class="field switch">
      <label>Archivar datos</label>
      <button id="archivar" class="toggle">OFF</button>
    </div>
    <div class="field">
      <button id="btnSave">Guardar Datos (SAVE)</button>
    </div>
    <div class="field"><label>Elementos</label><output id="contador">0</output></div>
    
    <div class="field"><label>K<sub>p</sub></label>
      <input type="number" id="kp" value="1" step="0.1">
    </div>
    <div class="field"><label>&#964</label>
      <input type="number" id="tau" value="1" step="0.1">
    </div>
    <div class="field"><label>&#952</label>
      <input type="number" id="theta" value="1" step="0.1">
    </div>
    <div class="field"><label>Inicial</label>
      <input type="number" id="inicial" value="0" step="0.1">
    </div>
  </div>
</section>

<!-- ===================== PESTAÑA VARIABLES ===================== -->
<section id="tab-variables" class="tab-page">
  <div class="panel">
    <div class="field wide">
      <label>Calibración PV (y = mx + b)</label>
      <div class="field"><label>m</label>
        <input type="number" id="m" value="0" step="0.01">
      </div>
      <div class="field"><label>b</label>
        <input type="number" id="b" value="0" step="0.01">
      </div>
    </div>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
